<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Replay</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  :root {
    --bg: #0d0e12;
    --panel: #15171d;
    --panel-2: #1c1f27;
    --line: #262a34;
    --text: #e9ebf0;
    --muted: #8a90a0;
    --accent: #e10600;
    --green: #2fbf71;
    --yellow: #f5c518;
    --red: #e10600;
    --purple: #a15cff;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 18px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .title { font-weight: 700; letter-spacing: .02em; }
  .title small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .lap { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .lap span { color: var(--muted); font-size: 14px; }
  .status { padding: 5px 12px; border-radius: 4px; font-weight: 700; font-size: 12px;
    letter-spacing: .06em; text-transform: uppercase; background: var(--panel-2); }
  .status.s1 { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
  .status.s2 { background: var(--yellow); color: #111; }
  .status.s4, .status.s6, .status.s7 { background: var(--yellow); color: #111; }
  .status.s5 { background: var(--red); color: #fff; }
  .weather { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-left: auto; }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; }
  .clock b { color: var(--text); font-size: 16px; }

  /* ---------- main grid ---------- */
  /* tower width = its fixed row columns; minis mode needs room for the mini-sector blocks */
  body { --tower-w: 326px; }
  body.tower-minis { --tower-w: 394px; }
  main { display: grid; grid-template-columns: var(--tower-w) 1fr 340px; min-height: 0; transition: grid-template-columns .25s ease; }
  body.feeds-collapsed main { grid-template-columns: var(--tower-w) 1fr 36px; }
  section { min-height: 0; display: flex; flex-direction: column; }
  .panel-head { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .seg button.on { background: var(--panel-2); color: var(--text); }

  /* tower */
  #tower-wrap { border-right: 1px solid var(--line); background: var(--panel); }
  #tower { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; }
  .row { position: absolute; left: 0; right: 0; height: 30px; display: grid;
    grid-template-columns: 22px 4px 16px 36px 30px 64px 50px 22px 18px; align-items: center; gap: 6px;
    padding: 0 10px 0 6px; transition: transform .6s ease, opacity .3s; cursor: pointer;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .row:hover { background: var(--panel-2); }
  .row.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .row .pos { font-family: var(--mono); font-weight: 700; text-align: right; }
  .row .bar { height: 18px; border-radius: 2px; }
  .row .tla { font-weight: 700; letter-spacing: .03em; }
  .row .flag { font-size: 10px; font-weight: 700; color: var(--muted); }
  .row .flag.pit { color: var(--yellow); }
  /* flex-end so an over-wide value spills left, into the badge column's spare space */
  .row .gap { font-family: var(--mono); font-size: 12.5px; display: flex; justify-content: flex-end;
    align-items: center; gap: 2px; white-space: nowrap; }
  .row .gap .catch { display: none; font-style: normal; font-size: 8px; color: var(--green); }
  .row .gap.catching { color: var(--green); }
  .row .gap.catching .catch { display: inline; }
  .row .flag .fl { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 16px;
    border-radius: 3px; background: var(--purple); color: #fff; }
  .row .tyre { width: 20px; height: 20px; border-radius: 50%; border: 3px solid; display: grid;
    place-items: center; font-size: 9px; font-weight: 800; background: #0b0b0e; }
  .row .stops { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }
  .head-ctl { display: flex; gap: 6px; }
  .secs { display: flex; gap: 2px; }
  .secs i { flex: 1; height: 7px; border-radius: 2px; background: #2a2e3a; transition: background .25s; }
  .secs i.y { background: var(--yellow); }
  .secs i.g { background: var(--green); }
  .secs i.p { background: var(--purple); }
  .secs i.pit { background: #4d6488; }
  /* mini-sector blocks: one group per sector, sized by how many minis it has */
  #tower.minis .row { grid-template-columns: 22px 4px 16px 36px 30px 64px 118px 22px 18px; }
  .row .logo, .c-logo { width: 16px; height: 16px; object-fit: contain; }
  .c-logo { vertical-align: -3px; margin-right: 5px; }
  .secs.minis { gap: 4px; }
  .secs.minis b { display: flex; gap: 1px; min-width: 0; }
  .secs.minis i { height: 9px; border-radius: 1px; }
  .row.out { opacity: .38; }

  .track-mode { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; }
  .track-mode .seg button { padding: 4px 10px; font-size: 11.5px; text-transform: none; letter-spacing: 0; }

  /* map */
  #map-wrap { position: relative; }
  #map-legend { position: absolute; right: 12px; bottom: 12px; display: none; gap: 12px; align-items: center;
    padding: 6px 10px; border-radius: 6px; background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  #map-legend.on { display: flex; }
  #map-legend b { color: var(--text); }
  #map-legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  #map { width: 100%; height: 100%; display: block; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

  /* feeds */
  #feeds { border-left: 1px solid var(--line); background: var(--panel); position: relative; overflow: hidden; }
  .collapse-btn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px;
    width: 22px; height: 20px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; margin-right: 8px; }
  .collapse-btn:hover { color: var(--text); border-color: var(--muted); }
  #feeds-rail { display: none; position: absolute; inset: 0; width: 100%; border: 0; background: var(--panel);
    color: var(--muted); cursor: pointer; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; }
  #feeds-rail:hover { color: var(--text); background: var(--panel-2); }
  #feeds-rail .rail-label { writing-mode: vertical-rl; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  #feeds-rail .rail-new { min-width: 20px; padding: 1px 5px; border-radius: 10px; background: var(--accent); color: #fff;
    font: 700 10.5px var(--mono); }
  #feeds-rail .rail-new:empty { display: none; }
  body.feeds-collapsed #feeds > :not(#feeds-rail) { visibility: hidden; }
  body.feeds-collapsed #feeds-rail { display: flex; }
  .feed { flex: 1; overflow-y: auto; min-height: 0; }
  .feed + .panel-head { border-top: 1px solid var(--line); }
  .msg { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; animation: in .4s ease; }
  .msg .meta { display: flex; gap: 8px; color: var(--muted); font-size: 11px; font-family: var(--mono); margin-bottom: 2px; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 10px; font-weight: 700;
    letter-spacing: .04em; background: var(--panel-2); color: var(--text); }
  .chip.GREEN, .chip.CLEAR { background: var(--green); color: #06170e; }
  .chip.YELLOW, .chip.DOUBLE { background: var(--yellow); color: #111; }
  .chip.RED { background: var(--red); color: #fff; }
  .chip.CHEQUERED { background: #fff; color: #111; }
  .chip.SC { background: var(--yellow); color: #111; }
  .radio { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; }
  .radio .bar { height: 28px; border-radius: 2px; }
  .radio button { background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 11px; }
  .radio.playing button { background: var(--accent); border-color: var(--accent); }
  .empty { color: var(--muted); padding: 14px 12px; font-size: 12px; }
  @keyframes in { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }

  /* ---------- transport ---------- */
  footer { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
    padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  .btns { display: flex; gap: 6px; align-items: center; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.play { width: 44px; height: 36px; font-size: 16px; background: var(--accent); border-color: var(--accent); }
  #scrub { width: 100%; accent-color: var(--accent); }
  .scrub-wrap { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .opts { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }
  .opts label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  #sync { font-family: var(--mono); min-width: 44px; text-align: center; color: var(--text); }
  .note { font-size: 11px; color: var(--muted); }

  /* ---------- driver card ---------- */
  /* #card holds one full card, or two compact ones stacked for comparing */
  #card { position: absolute; top: 12px; left: 12px; width: 340px; max-height: calc(100% - 24px);
    overflow-y: auto; display: none; flex-direction: column; gap: 10px; z-index: 5; }
  #card.open { display: flex; animation: pop .18s ease; }
  .dcard { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); overflow: hidden; }
  /* compact cards are slimmed so two fit one above the other */
  .dcard.compact .c-head { min-height: 64px; grid-template-columns: 62px 1fr; padding-top: 6px; }
  .dcard.compact .c-head > img { width: 62px; height: 62px; }
  .dcard.compact .c-name { padding-bottom: 8px; }
  .dcard.compact .c-name b { font-size: 17px; }
  .dcard.compact .c-num { font-size: 44px; }
  .dcard.compact .c-sec { padding: 7px 12px; }
  .dcard.compact .c-grid { gap: 4px 10px; }
  .dcard.compact .c-stat b { font-size: 14px; }
  .dcard.compact .c-sec h4 { display: none; }
  /* speed / gear as two rows (value, label) instead of four stacked lines */
  .dcard.compact .tel-big { display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline;
    text-align: left; min-width: 0; }
  .dcard.compact .tel-big b { font-size: 24px; }
  .dcard.compact .tel-gear { font-size: 18px; }
  .dcard.compact .trace { height: 78px; margin-top: 6px; }
  .dcard.compact .legend { margin-top: 3px; }
  .c-compare { position: absolute; top: 6px; right: 40px; z-index: 1; background: rgba(0,0,0,.35); border: 0; color: #fff;
    height: 26px; padding: 0 10px; border-radius: 13px; cursor: pointer; font-size: 11.5px; font-weight: 600; }
  .c-compare:hover { background: rgba(0,0,0,.55); }
  .c-compare.picking { background: var(--accent); }
  .row, .p-row { user-select: none; }  /* shift+click to compare shouldn't select text */
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .c-head { position: relative; display: grid; grid-template-columns: 96px 1fr; align-items: end;
    min-height: 112px; padding: 12px 14px 0 8px; overflow: hidden;
    background: linear-gradient(135deg, color-mix(in srgb, var(--team) 70%, #000) 0%, color-mix(in srgb, var(--team) 18%, var(--panel)) 75%); }
  .c-head > img { width: 96px; height: 96px; object-fit: cover; object-position: top; display: block; }
  .c-num { position: absolute; right: 12px; top: 2px; font: 800 64px/1 var(--mono); color: rgba(255,255,255,.14); }
  .c-name { padding: 0 0 12px 8px; }
  .c-name small { display: block; color: rgba(255,255,255,.75); font-size: 12px; }
  .c-name b { display: block; font-size: 20px; line-height: 1.1; }
  .c-close { position: absolute; top: 6px; right: 8px; z-index: 1; background: rgba(0,0,0,.35); border: 0;
    color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .c-badge { display: inline-block; margin-top: 4px; padding: 1px 7px; border-radius: 3px; font-size: 10px;
    font-weight: 800; letter-spacing: .06em; background: var(--yellow); color: #111; }
  .c-badge.out { background: #555; color: #fff; }
  .c-sec { padding: 10px 14px; border-top: 1px solid var(--line); }
  .c-sec h4 { margin: 0 0 7px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .c-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; }
  .c-grid.four { grid-template-columns: repeat(4, 1fr); }
  .c-stat small { display: block; font-size: 10.5px; color: var(--muted); }
  .c-stat b { font: 700 15px var(--mono); }
  .c-stat .rank { font: 500 10.5px var(--mono); color: var(--muted); margin-left: 3px; }
  .pb { color: var(--green); }
  .ob { color: var(--purple); }
  .up { color: var(--green); font-size: 11px; }
  .down { color: var(--red); font-size: 11px; }
  .tel { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .tel-big { text-align: center; min-width: 78px; }
  .tel-big b { display: block; font: 800 30px/1 var(--mono); }
  .tel-big small { color: var(--muted); font-size: 10.5px; }
  .tel-gear { font: 800 22px var(--mono); }
  .meter { display: grid; grid-template-columns: 54px 1fr 38px; gap: 6px; align-items: center; font-size: 10.5px; color: var(--muted); margin: 3px 0; }
  .meter i { display: block; height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .meter i span { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .08s linear; }
  .meter em { font: normal 11px var(--mono); color: var(--text); text-align: right; }
  .trace { display: block; width: 100%; height: 120px; margin-top: 10px; background: var(--bg); border-radius: 4px; }
  .legend { display: flex; gap: 10px; font-size: 10.5px; color: var(--muted); margin-top: 5px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .stints { display: flex; gap: 3px; height: 22px; }
  .stint { display: grid; place-items: center; border-radius: 3px; font: 700 10.5px var(--mono); color: #111; min-width: 22px; }
  .c-list { font-size: 12px; font-family: var(--mono); }
  .c-list div { display: flex; justify-content: space-between; padding: 2px 0; }
  .c-list span { color: var(--muted); }
  .c-empty { color: var(--muted); font-size: 12px; }
  .c-radio { display: flex; flex-wrap: wrap; gap: 6px; }
  .c-radio button { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 14px;
    padding: 3px 10px; font: 11px var(--mono); cursor: pointer; }
  .c-radio button.playing { background: var(--accent); border-color: var(--accent); }

  /* ---------- strategy / championship panel ---------- */
  .top-btns { display: flex; gap: 6px; }
  .top-btns .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #panel { position: absolute; top: 12px; right: 12px; width: 470px; max-width: calc(100% - 24px);
    max-height: calc(100% - 24px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.55); display: none; z-index: 5; }
  #panel.open { display: block; animation: pop .18s ease; }
  .p-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .p-head h3 { margin: 0; font-size: 13px; font-weight: 700; flex: 1; }
  .p-head h3 small { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .p-close { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 50%;
    width: 24px; height: 24px; cursor: pointer; font-size: 12px; }
  .p-body { padding: 6px 12px 12px; }
  .p-note { color: var(--muted); font-size: 11.5px; padding: 6px 0 4px; }
  .p-row { display: grid; align-items: center; gap: 6px; height: 24px; cursor: pointer; border-radius: 3px; padding: 0 4px; }
  .p-row:hover { background: var(--panel-2); }
  .p-row.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .p-row.out { opacity: .4; }
  .p-row .pos { font: 700 12px var(--mono); text-align: right; }
  .p-row img { width: 14px; height: 14px; object-fit: contain; }
  .p-row .tla { font-weight: 700; font-size: 12.5px; }
  /* strategy */
  .st-row { grid-template-columns: 20px 14px 34px 1fr; }
  .st-track { position: relative; height: 14px; display: flex; gap: 1px; background: var(--panel-2); border-radius: 2px; }
  .st-stint { height: 100%; border-radius: 2px; display: flex; align-items: center; justify-content: center;
    font: 700 9.5px var(--mono); color: #111; overflow: hidden; white-space: nowrap; min-width: 3px; }
  .st-stint.used { background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(0,0,0,.28) 3px 5px); }
  .st-axis { position: relative; height: 16px; margin-left: 86px; font: 10px var(--mono); color: var(--muted); }
  .st-axis span { position: absolute; transform: translateX(-50%); }
  .st-now { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .7; border-radius: 1px; }
  .legend-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); padding-top: 8px; }
  .legend-row i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  /* championship */
  .ch-row { grid-template-columns: 22px 30px 14px 1fr 54px 44px; }
  .ch-row.team { grid-template-columns: 22px 30px 14px 1fr 54px 44px; }
  .ch-row .name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-row .name b { margin-right: 5px; }
  .ch-row .move { font: 700 10.5px var(--mono); }
  .ch-row .pts { font: 700 12.5px var(--mono); text-align: right; }
  .ch-row .gain { font: 11px var(--mono); color: var(--green); text-align: right; }
  .ch-head { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; cursor: default; height: 20px; }
  .ch-head:hover { background: none; }

  /* ---------- Formula E replays: no commentary, telemetry, radio, tyres or championship panel ---------- */
  body.fe { --tower-w: 304px; }
  body.fe .top-btns, body.fe #tower-secs, body.fe #track-mode [data-mode="mini"],
  body.fe #radio-head, body.fe #radio, body.fe #blue-note, body.fe .c-compare { display: none; }
  body.fe .row { grid-template-columns: 22px 4px 36px 30px 64px 50px 22px 18px; }
  body.fe .row .logo { display: none; }
  #map-note { display: none; position: absolute; left: 12px; bottom: 12px; padding: 4px 8px; border-radius: 4px;
    font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); }
  body.fe #map-note { display: block; }
  .row .flag .fl.atk { background: var(--yellow); color: #111; }
  .c-badge.atk { background: var(--yellow); color: #111; }

  @media (max-width: 1200px) {
    main, body.feeds-collapsed main { grid-template-columns: var(--tower-w) 1fr; }
    #feeds { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="title"><span id="t-meeting">Loading…</span><small id="t-session"></small></div>
  <div class="lap" id="lap">–</div>
  <div class="status" id="status">–</div>
  <div class="track-mode" title="Paint the track map by sector">
    <span>Track</span>
    <span class="seg" id="track-mode">
      <button data-mode="off">Clean</button><button data-mode="sectors">Sectors</button><button data-mode="mini">Mini-sectors</button>
    </span>
  </div>
  <div class="track-mode" title="Units">
    <span>Units</span>
    <span class="seg" id="unit-speed"><button data-speed="kmh">km/h</button><button data-speed="mph">mph</button></span>
    <span class="seg" id="unit-temp"><button data-temp="c">°C</button><button data-temp="f">°F</button></span>
